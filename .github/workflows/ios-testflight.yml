# Builds the iOS shell app (apps/ios/) on a GitHub-hosted Mac and uploads it to
# App Store Connect / TestFlight — no local Mac needed.
#
# One-time setup (after Apple Developer enrollment is active):
#   1. App Store Connect → Users and Access → Integrations → App Store Connect API
#      → Team Keys → Generate API Key (role: App Manager). Download the .p8 once.
#   2. GitHub repo → Settings → Secrets and variables → Actions → New repository
#      secret, four of them:
#        ASC_KEY_ID      — the Key ID shown next to the generated key
#        ASC_ISSUER_ID   — the Issuer ID shown at the top of the same page
#        ASC_KEY_P8      — the full text contents of the downloaded .p8 file
#        APPLE_TEAM_ID   — Membership details → Team ID (10 characters)
#   3. App Store Connect → Apps → “+” → New App: platform iOS, bundle ID
#      com.alasl.almaneesee (register the bundle ID at developer.apple.com/account
#      → Identifiers if it isn’t offered in the dropdown), SKU almaneesee-ios.
#
# Then run this workflow from the Actions tab (Run workflow). The build lands
# in TestFlight within ~15 minutes of the run finishing.
name: iOS — TestFlight upload

# Started by hand only: Actions tab → Run workflow (pick the marketing
# version). Once the App Store Connect secrets exist, a push trigger on
# apps/ios/VERSION can be added back (see git history of the Mutūn repo).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (what users see, e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ]    && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ]    && missing="$missing ASC_KEY_P8"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings → Secrets and variables → Actions (see the header of this workflow file)."
            exit 1
          fi
          echo "All four secrets present."

      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # App Store Connect only accepts uploads built with the current
        # major Xcode/SDK (iOS 26+ as of 2026).
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec apps/ios/project.yml --project apps/ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Resolve marketing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(cat apps/ios/VERSION | tr -d '[:space:]')}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building marketing version $VERSION (build ${{ github.run_number }})"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project apps/ios/AlManeesee.xcodeproj \
            -scheme AlManeesee \
            -destination 'generic/platform=iOS' \
            -archivePath build/AlManeesee.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/AlManeesee.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
