# XcodeGen spec — the CI workflow (.github/workflows/ios-testflight.yml) runs
# `xcodegen generate` to produce AlManeesee.xcodeproj from this file, so the repo
# never has to carry a checked-in .xcodeproj.
name: AlManeesee
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
targets:
  AlManeesee:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alasl.almaneesee
        PRODUCT_NAME: AlManeesee
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 1,2 = iPhone + iPad. Without the 2 iPadOS runs the app in iPhone
        # compatibility mode: a letterboxed phone-shaped window in the middle of
        # the screen. Adding it requires iPad screenshots in App Store Connect.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
